name: nsidc0802v3
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - earthaccess
  # Core numerics
  - numpy
  - scipy
  - pandas
  - dask
  # NetCDF / array I/O
  - netcdf4
  - xarray
  - zarr
  # Geospatial / resampling
  - pyproj
  - pyresample
  # Regression (sklearn.linear_model)
  - scikit-learn
  # Config parsing (yaml, yaml.scanner)
  - pyyaml
  # Date parsing (dateutil.parser)
  - python-dateutil
  # Plotting
  - matplotlib
